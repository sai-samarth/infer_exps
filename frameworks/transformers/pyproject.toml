[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "infer-exps-transformers"
version = "0.1.0"
description = "Plain Hugging Face Transformers baseline experiments for infer_exps"
requires-python = ">=3.10"
dependencies = [
  "torch",
  "transformers",
  "accelerate",
  "safetensors",
  "sentencepiece",
]

[tool.setuptools.packages.find]
where = ["src"]
